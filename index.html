<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Verified / تم التحقق من الحساب</title>
  <!-- Google Fonts for Cairo (Arabic) and Inter (English) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.25s ease;
    }

    :root {
      --primary-color: #4CA154;
      --primary-hover: #3d8843;
      --primary-light: #f0f8f1;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-dark);
    }

    /* RTL specific font adjustment */
    [dir="rtl"] body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .lang-switcher-container {
      margin-bottom: 20px;
    }

    .lang-toggle-btn {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .lang-toggle-btn:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
      background-color: var(--primary-light);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: 5px solid var(--primary-color);
      border-radius: 16px;
      padding: 44px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .icon-container {
      width: 68px;
      height: 68px;
      background-color: var(--primary-light);
      border: 2px solid var(--primary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      box-shadow: 0 4px 12px rgba(76, 161, 84, 0.15);
    }

    .icon-container svg {
      width: 34px;
      height: 34px;
      fill: var(--primary-color);
    }

    h1 {
      color: var(--text-dark);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .divider {
      height: 3px;
      background-color: var(--primary-color);
      width: 60px;
      margin: 16px auto 24px auto;
      border-radius: 3px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .continue-link {
      display: inline-block;
      color: var(--primary-color);
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .continue-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
      background-color: var(--primary-light);
    }
  </style>
</head>
<body>

  <div class="lang-switcher-container">
    <button class="lang-toggle-btn" id="langToggleBtn" onclick="toggleLanguage()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      <span id="langBtnText">العربية</span>
    </button>
  </div>

  <div class="card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
    </div>

    <h1 id="titleText">Your account is verified</h1>

    <div class="divider"></div>

    <p class="subtitle" id="subtitleText">You can now return to the app or close this window.</p>

    <!-- Continuation text link instead of a solid button -->
    <a href="#" class="continue-link" id="continueLink">Continue to the app and login &rarr;</a>
  </div>

  <script>
    // Language content definitions
    const translations = {
      en: {
        dir: "ltr",
        lang: "en",
        title: "Your account is verified",
        subtitle: "You can now return to the app or close this window.",
        continueText: "Continue to the app and login &rarr;",
        toggleBtn: "العربية"
      },
      ar: {
        dir: "rtl",
        lang: "ar",
        title: "تم التحقق من حسابك بنجاح",
        subtitle: "يمكنك الآن العودة إلى التطبيق أو إغلاق هذه النافذة.",
        continueText: "&leftarrow; متابعة إلى التطبيق وتسجيل الدخول",
        toggleBtn: "English"
      }
    };

    let currentLang = "en";

    function toggleLanguage() {
      currentLang = currentLang === "en" ? "ar" : "en";
      const t = translations[currentLang];

      // Update HTML attributes for layout direction & language
      document.documentElement.setAttribute("dir", t.dir);
      document.documentElement.setAttribute("lang", t.lang);

      // Update Text Content
      document.getElementById("titleText").innerText = t.title;
      document.getElementById("subtitleText").innerText = t.subtitle;
      document.getElementById("continueLink").innerHTML = t.continueText;
      document.getElementById("langBtnText").innerText = t.toggleBtn;
    }
  </script>
</body>
</html>
